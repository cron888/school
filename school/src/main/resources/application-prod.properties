# Production profile
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hogwarts}
spring.datasource.username=${DB_USER:student}
spring.datasource.password=${DB_PASSWORD:chocolatefrog}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.liquibase.change-log=classpath:db/changelog/lesson-three.xml
spring.liquibase.enabled=true

# Production logging
logging.level.root=WARN
logging.level.ru.hogwarts.school=INFO
logging.file.name=logs/school.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
